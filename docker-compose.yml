services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      REDIS_URL: redis://redis:6379/0
      SESSION_TTL_SECONDS: "86400"
      LOG_FORMAT: json
      LOG_LEVEL: INFO
      JUDGE_API_KEY: ${JUDGE_API_KEY}
      JUDGE_BASE_URL: ${JUDGE_BASE_URL:-https://open.bigmodel.cn/api/paas/v4/}
      JUDGE_MODEL: ${JUDGE_MODEL:-glm-4}
      USE_LLM_SCORING: ${USE_LLM_SCORING:-true}
      USE_LLM_REPORT: ${USE_LLM_REPORT:-true}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz')",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 25s
